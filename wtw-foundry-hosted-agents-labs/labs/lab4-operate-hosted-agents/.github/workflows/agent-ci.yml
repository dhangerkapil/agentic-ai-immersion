# Lab 4: AgentOps pipeline for the via-concierge-hosted agent (Lab 2 hosted/ folder).
# Copy this file to <repo root>/.github/workflows/agent-ci.yml. Paths below assume the labs folder lives at
# wtw-foundry-hosted-agents-labs/ in the repo (drop-in to github.com/dhangerkapil/agentic-ai-immersion).
#
# Stages: validate (compile, self-tests, notebook check; no Azure) -> evaluate (eval gate against a hosted/main.py
# started on the runner, Entra via OIDC) -> deploy dev (azd from source) -> smoke -> promote (manual dispatch to
# test/prod with environment approvals) -> rollback (manual, redeploys a tag).
# No secrets in this file. Auth is GitHub OIDC federated credentials on an Entra app; per-environment values live
# in GitHub Environments as variables (none of them are secret: Entra only, no API keys).

name: agent-ci

on:
  push:
    branches: [main]
    paths:
      - "wtw-foundry-hosted-agents-labs/common/**"
      - "wtw-foundry-hosted-agents-labs/data/**"
      - "wtw-foundry-hosted-agents-labs/labs/**"
  pull_request:
    paths:
      - "wtw-foundry-hosted-agents-labs/**"
  workflow_dispatch:
    inputs:
      target_environment:
        description: "dev | test | prod"
        required: true
        default: "dev"
      rollback_to:
        description: "git tag or sha to redeploy (leave empty for a normal deploy)"
        required: false
        default: ""

permissions:
  id-token: write      # OIDC token for azure/login
  contents: read
  pull-requests: write # eval summary comment

env:
  WTW_DIR: wtw-foundry-hosted-agents-labs
  LABS_DIR: wtw-foundry-hosted-agents-labs/labs
  HOSTED_DIR: wtw-foundry-hosted-agents-labs/labs/lab2-hosted-knowledge-sessions/hosted
  LAB4_DIR: wtw-foundry-hosted-agents-labs/labs/lab4-operate-hosted-agents
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    name: compile + self-tests + notebook check (no Azure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Workstation packages (agent-framework, azure-search-documents, azure-ai-evaluation, ruff,
          # jupyter, ...) are already pinned in the repo root requirements.txt; labs/requirements.txt is
          # a pointer, not a second lock — see that file.
          pip install -r requirements.txt
      - name: Ruff
        run: ruff check ${WTW_DIR} --select E,F,W --ignore E501
      - name: Compile every lab and hosted file
        run: python -m compileall -q ${WTW_DIR}
      - name: Shared code self-tests (data, session store, message store; no model)
        working-directory: ${{ env.WTW_DIR }}
        run: |
          python common/via_data.py
          python common/session_store.py
          python common/message_store.py
      - name: Notebooks are valid nbformat 4
        working-directory: ${{ env.WTW_DIR }}
        run: |
          for nb in $(find labs -name "*_walkthrough.ipynb"); do python tools/py_to_ipynb.py --check "$nb"; done
      - name: Compliance block present in every hosted main.py
        working-directory: ${{ env.WTW_DIR }}
        run: |
          for f in $(find labs -path "*hosted*/main.py"); do grep -q "COMPLIANCE_INSTRUCTIONS" "$f" || { echo "missing in $f"; exit 1; }; done

  evaluate:
    name: eval gate (Groundedness, Relevance, NoRecommendation, PiiLeak)
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
      - name: Azure login (OIDC, no secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Write .env for this environment
        run: |
          cp ${LAB4_DIR}/envs/.env.dev.example ${WTW_DIR}/.env
          sed -i "s|^FOUNDRY_PROJECT_ENDPOINT=.*|FOUNDRY_PROJECT_ENDPOINT=${{ vars.FOUNDRY_PROJECT_ENDPOINT }}|" ${WTW_DIR}/.env
          sed -i "s|^AZURE_OPENAI_ENDPOINT=.*|AZURE_OPENAI_ENDPOINT=${{ vars.AZURE_OPENAI_ENDPOINT }}|" ${WTW_DIR}/.env
          sed -i "s|^AZURE_AI_SEARCH_ENDPOINT=.*|AZURE_AI_SEARCH_ENDPOINT=${{ vars.AZURE_AI_SEARCH_ENDPOINT }}|" ${WTW_DIR}/.env
          sed -i "s|^PROJECT_RESOURCE_ID=.*|PROJECT_RESOURCE_ID=${{ vars.PROJECT_RESOURCE_ID }}|" ${WTW_DIR}/.env
          sed -i "s|^VIA_KB_MCP_URL=.*|VIA_KB_MCP_URL=${{ vars.VIA_KB_MCP_URL }}|" ${WTW_DIR}/.env
      - name: Recreate the Lab 2 artifacts (knowledge.json, hosted.json; the knowledge base already exists in dev)
        working-directory: ${{ env.LABS_DIR }}
        run: python catch_up.py --through 2
      - name: Eval gate (starts hosted/main.py on the runner, asks the 18 golden questions, judges them)
        working-directory: ${{ env.LAB4_DIR }}
        run: python eval_gate.py --run --target local --limit 18
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ github.sha }}
          path: |
            ${{ env.LABS_DIR }}/artifacts/lab4/eval_report.md
            ${{ env.LABS_DIR }}/artifacts/lab4/eval_results.jsonl
            ${{ env.LABS_DIR }}/artifacts/lab4/gate_result.json

  deploy:
    name: deploy hosted agent (azd, from source)
    needs: evaluate
    if: github.event_name != 'pull_request' && github.event.inputs.rollback_to == ''
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: Azure/setup-azd@v2
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Vendor shared code into hosted/
        working-directory: ${{ env.HOSTED_DIR }}
        run: python prepare.py
      - name: azd deploy from source
        working-directory: ${{ env.HOSTED_DIR }}
        env:
          AZD_ENV_NAME: via-concierge-${{ github.event.inputs.target_environment || 'dev' }}
        run: |
          azd config set auth.useAzCliAuth true
          azd extension install azure.ai.agents
          azd env new "$AZD_ENV_NAME" --no-prompt || azd env select "$AZD_ENV_NAME"
          azd ai agent init --no-prompt --project-id "${{ vars.PROJECT_RESOURCE_ID }}" \
            --agent-name via-concierge-hosted --model-deployment "${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}" \
            --protocol responses --deploy-mode code --runtime python_3_14 --entry-point main.py --dep-resolution remote_build
          azd env set VIA_KB_MCP_URL "${{ vars.VIA_KB_MCP_URL }}"
          azd env set VIA_REDIS_URL "${{ vars.VIA_REDIS_URL }}"
          azd env set APPLICATIONINSIGHTS_CONNECTION_STRING "${{ vars.APPLICATIONINSIGHTS_CONNECTION_STRING }}"
          azd up --no-prompt
      - name: Record deployment
        working-directory: ${{ env.LABS_DIR }}
        env:
          TARGET_ENV: ${{ github.event.inputs.target_environment || 'dev' }}
        run: |
          python - <<'PY'
          import json, pathlib, datetime, os
          path = pathlib.Path("artifacts/lab2/hosted.json"); path.parent.mkdir(parents=True, exist_ok=True)
          record = json.loads(path.read_text()) if path.exists() else {"agent_name": "via-concierge-hosted", "protocol": "responses"}
          record.update({"status": "deployed", "environment": os.environ["TARGET_ENV"], "git_sha": os.environ["GITHUB_SHA"],
                         "deployed_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")})
          path.write_text(json.dumps(record, indent=2))
          PY
      - name: Smoke test the deployed agent
        working-directory: ${{ env.HOSTED_DIR }}
        run: python test_local.py --deployed --session ci-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-${{ github.sha }}
          path: ${{ env.LABS_DIR }}/artifacts/lab2/hosted.json

  rollback:
    name: rollback (redeploy a known-good tag)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_to != ''
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rollback_to }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: Azure/setup-azd@v2
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Redeploy the tagged source
        working-directory: ${{ env.HOSTED_DIR }}
        run: |
          python prepare.py
          azd config set auth.useAzCliAuth true
          azd extension install azure.ai.agents
          azd env select "via-concierge-${{ github.event.inputs.target_environment }}"
          azd up --no-prompt
      - name: Smoke test after rollback
        working-directory: ${{ env.HOSTED_DIR }}
        run: python test_local.py --deployed --session rollback-${{ github.run_id }}
